name: Foody checks and screenshots

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "docs/screenshots/**"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile backend
        working-directory: Backend
        run: python -m compileall -q MyDB

      - name: Test backend helpers
        working-directory: Backend
        run: python -m unittest discover -s tests -v

      - name: Use Node.js 14
        uses: actions/setup-node@v4
        with:
          node-version: "14.21.3"
          cache: npm
          cache-dependency-path: FrontEnd/Projet/package-lock.json

      - name: Install frontend dependencies
        working-directory: FrontEnd/Projet
        run: npm ci

      - name: Build Angular app
        working-directory: FrontEnd/Projet
        run: npm run build

      - name: Install Playwright
        working-directory: FrontEnd/Projet
        run: npm install --no-save playwright@1.30.0

      - name: Install Chromium
        working-directory: FrontEnd/Projet
        run: npx playwright install chromium

      - name: Serve built app
        working-directory: FrontEnd/Projet
        run: npx serve@14 dist/Projet -s -l 4200 > /tmp/foody-http.log 2>&1 &

      - name: Wait for frontend
        working-directory: FrontEnd/Projet
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4200/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/foody-http.log
          exit 1

      - name: Capture browser screenshots
        working-directory: FrontEnd/Projet
        run: |
          mkdir -p ../../docs/screenshots
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });

            await page.goto('http://127.0.0.1:4200/', { waitUntil: 'domcontentloaded', timeout: 20000 });
            await page.locator('.carousel-inner img').first().waitFor({ state: 'attached' });
            await page.waitForFunction(() =>
              Array.from(document.querySelectorAll('.carousel-inner img'))
                .every((image) => image.complete && image.naturalWidth > 0)
            , null, { timeout: 15000 });

            await page.screenshot({ path: '../../docs/screenshots/01-home.png', fullPage: true });

            await page.goto('http://127.0.0.1:4200/signup', { waitUntil: 'domcontentloaded' });
            await page.locator('h3').filter({ hasText: 'SIGN UP' }).waitFor();
            await page.screenshot({ path: '../../docs/screenshots/02-sign-up.png', fullPage: true });

            await page.goto('http://127.0.0.1:4200/login', { waitUntil: 'domcontentloaded' });
            await page.locator('h3').filter({ hasText: 'LOG IN' }).waitFor();
            await page.screenshot({ path: '../../docs/screenshots/03-login.png', fullPage: true });

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload browser screenshots
        uses: actions/upload-artifact@v4
        with:
          name: foody-browser-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
